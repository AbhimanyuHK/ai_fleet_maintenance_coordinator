name: AI Grounding Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

jobs:
  evidence-contract:
    name: Validate AI evidence contract
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/evaluate_qwen_grounding.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-ai-grounding-evaluation
          path: artifacts/phase3/qwen_evaluation.json
          if-no-files-found: error
          retention-days: 14

  qwen-runtime:
    name: Qwen 2.5 3B runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ai.txt
      - name: Verify model runtime imports
        run: python -c "import torch, transformers, sentence_transformers, faiss; print('AI runtime dependencies OK')"
