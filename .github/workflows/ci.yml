name: CI

on:
  push:
    branches: [main, phase-1-data-foundation]
  pull_request:
    branches: [main]

jobs:
  test-and-data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/validate_phase1_data.py
      - run: python scripts/build_phase1_curated.py
      - run: python scripts/generate_phase1_readiness_report.py
